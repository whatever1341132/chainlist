name: Main Platform CI/CD

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"  # Runs daily at midnight UTC

jobs:
  # ----------------------------
  # Step 1: Node.js Build
  # ----------------------------
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn --immutable
      - name: Build project
        run: yarn build
      - name: Require clean working directory
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "Working tree dirty at end of job"
            exit 1
          fi

  # ----------------------------
  # Step 2: Python Wallet + Token Consolidation
  # ----------------------------
  consolidate-wallets:
    name: Wallet & Token Consolidation
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install web3 eth-account decimal
      - name: Run Wallet Consolidation Script
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          ADMIN_PRIVATE_KEY: ${{ secrets.ADMIN_PRIVATE_KEY }}
        run: python scripts/super_token_platform.py

  # ----------------------------
  # Step 3: Pre-deploy check
  # ----------------------------
  check-deploy:
    name: Pre-Deploy Check
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@v3
      - id: check
        run: |
          ./scripts/check-deploy.sh
          echo "deploy=true" >> $GITHUB_OUTPUT
        shell: bash

  # ----------------------------
  # Step 4: Publish to gh-pages
  # ----------------------------
  publish-reports:
    name: Publish Reports
    needs: [consolidate-wallets, check-deploy]
    if: needs.check-deploy.outputs.deploy == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      destination_dir: ./reports