name: Main Platform CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ----------------------------
  # Step 1: Build Frontend
  # ----------------------------
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn --immutable
      - name: Build project
        run: yarn build
      - name: Require clean working directory
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "Working tree dirty at end of job"
            exit 1
          fi

  # ----------------------------
  # Step 2: Python Wallet + Token Consolidation
  # ----------------------------
  consolidate-wallets:
    name: Wallet & Token Consolidation
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install web3 eth-account decimal
      - name: Run Wallet Consolidation Script
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          ADMIN_PRIVATE_KEY: ${{ secrets.ADMIN_PRIVATE_KEY }}
        run: python scripts/super_token_platform.py

  # ----------------------------
  # Step 3: Publish to GitHub Pages
  # ----------------------------
  publish-reports:
    name: Publish Reports
    runs-on: ubuntu-latest
    needs: consolidate-wallets
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Validate destination_dir input
        if: ${{ inputs.destination_dir == '' }}
        run: |
          echo "❌ destination_dir input cannot be empty"
          exit 1
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: yarn --immutable
      - name: Build project
        run: yarn build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          destination_dir: ${{ inputs.destination_dir }}